name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Package web distribution
        run: |
          cd dist
          zip -r ../untoldable-lines-${{ github.ref_name }}-web.zip .
          cd ..
          sha256sum untoldable-lines-${{ github.ref_name }}-web.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            untoldable-lines-${{ github.ref_name }}-web.zip
            checksums.txt
          generate_release_notes: true
